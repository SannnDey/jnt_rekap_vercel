version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: jnt_rekap_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: jnt_rekap
      MYSQL_USER: jnt_user
      MYSQL_PASSWORD: jnt_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Optional: PhpMyAdmin untuk GUI database management
  phpmyadmin:
    image: phpmyadmin
    container_name: jnt_rekap_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: jnt_user
      PMA_PASSWORD: jnt_password
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
    driver: local
